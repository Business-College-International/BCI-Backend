name: Establish Verified Initial Migration

on:
  push:
    branches:
      - chore/establish-initial-migration

permissions:
  contents: write

jobs:
  establish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bci
          POSTGRES_PASSWORD: bci
          POSTGRES_DB: bci_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bci -d bci_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://bci:bci@localhost:5432/bci_migration?schema=public
      DIRECT_URL: postgresql://bci:bci@localhost:5432/bci_migration?schema=public
      NODE_ENV: test
      JWT_ACCESS_SECRET: migration-ci-only-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate

      - name: Generate canonical initial migration
        run: |
          mkdir -p prisma/migrations/20260918060000_initial_foundation
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/20260918060000_initial_foundation/migration.sql
          cat > prisma/migrations/migration_lock.toml <<'EOF'
          # Please do not edit this file manually.
          # It is committed by Prisma to record the migration provider.
          provider = "postgresql"
          EOF

      - name: Deploy migration to clean PostgreSQL
        run: npx prisma migrate deploy

      - name: Reconcile deployed database against schema
        run: npx prisma migrate diff --from-schema-datamodel prisma/schema.prisma --to-url "$DATABASE_URL" --exit-code

      - name: Build and test
        run: |
          npm run build
          npm test -- --passWithNoTests

      - name: Commit migration and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/establish-initial-migration.yml
          git add prisma/migrations
          git diff --cached --check
          git commit -m "chore(db): establish verified initial Prisma migration"
          git push origin HEAD:chore/establish-initial-migration
