name: Backend CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bci-pr-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bci:bci@localhost:5432/bci_ci
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-only-bci-secret-not-for-production
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build
      - run: npm test -- --passWithNoTests
