name: Backend CI

on:
  pull_request:
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-prisma-pr6:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.number == 6 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'migration/bootstrap-baseline-review'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Normalize compact Prisma enum declarations
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('prisma/schema.prisma')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'^enum\s+(\w+)\s*\{\s*([^{}]+?)\s*\}\s*$', re.MULTILINE)

          def repl(match):
              name = match.group(1)
              values = match.group(2).split()
              body = '\n'.join(f'  {value}' for value in values)
              return f'enum {name} {{\n{body}\n}}'

          normalized = pattern.sub(repl, text)
          if normalized == text:
              print('Prisma enums already normalized.')
          else:
              path.write_text(normalized, encoding='utf-8')
              print('Normalized compact Prisma enum declarations.')
      - name: Commit normalized schema to PR branch
        shell: bash
        run: |
          if git diff --quiet -- prisma/schema.prisma; then
            echo 'No schema repair needed.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "fix(prisma): normalize enum declarations"
          git push origin HEAD:migration/bootstrap-baseline-review

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build
      - run: npm test -- --passWithNoTests
