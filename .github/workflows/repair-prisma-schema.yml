name: Repair Prisma Schema Syntax

on:
  push:
    branches:
      - migration/bootstrap-baseline-review

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/migration/bootstrap-baseline-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize compact enum declarations
        id: normalize
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('prisma/schema.prisma')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(r'^enum\s+(\w+)\s*\{\s*([^{}]+?)\s*\}\s*$', re.MULTILINE)

          def repl(match):
              name = match.group(1)
              values = match.group(2).split()
              body = '\n'.join(f'  {value}' for value in values)
              return f'enum {name} {{\n{body}\n}}'

          normalized = pattern.sub(repl, text)
          changed = normalized != text
          path.write_text(normalized, encoding='utf-8')
          print(f'changed={changed}')

          if changed:
              Path('/tmp/schema_changed').write_text('yes', encoding='utf-8')
          else:
              Path('/tmp/schema_changed').write_text('no', encoding='utf-8')

      - name: Validate repaired schema
        run: |
          if [ "$(cat /tmp/schema_changed)" = "yes" ]; then
            npm install
            npx prisma validate
          else
            echo 'Schema already normalized; no repair commit required.'
          fi

      - name: Commit repair
        if: hashFiles('prisma/schema.prisma') != ''
        shell: bash
        run: |
          if [ "$(cat /tmp/schema_changed)" != "yes" ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "fix(prisma): normalize enum declarations"
          git push origin HEAD:migration/bootstrap-baseline-review
