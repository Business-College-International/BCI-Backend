name: Repair Prisma Schema Through PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'prisma/schema.prisma'
      - '.github/workflows/repair-prisma-on-pr.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'migration/bootstrap-baseline-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/bootstrap-baseline-review
          fetch-depth: 0

      - name: Normalize compact enum declarations
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('prisma/schema.prisma')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'^enum\s+(\w+)\s*\{\s*([^{}]+?)\s*\}\s*$', re.MULTILINE)

          def repl(match):
              name = match.group(1)
              values = match.group(2).split()
              body = '\n'.join(f'  {value}' for value in values)
              return f'enum {name} {{\n{body}\n}}'

          normalized = pattern.sub(repl, text)
          if normalized == text:
              print('No compact enum declarations remain.')
              raise SystemExit(0)
          path.write_text(normalized, encoding='utf-8')

      - name: Validate normalized schema
        run: |
          npm install
          npx prisma validate

      - name: Commit normalized schema
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "fix(prisma): normalize enum declarations"
          git push origin HEAD:migration/bootstrap-baseline-review
